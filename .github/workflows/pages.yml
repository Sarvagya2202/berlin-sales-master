name: Unpack and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip parts and move site files to the top level
        run: |
          shopt -s nullglob dotglob
          for z in *.zip *.ZIP; do unzip -o -q "$z" -d . && rm -f "$z"; done
          for d in */; do
            d="${d%/}"
            case "$d" in catalogs|catprev|docs|img|.github|.git) continue;; esac
            find "$d" -iname '*.zip' -type f -print0 | while IFS= read -r -d '' z; do unzip -o -q "$z" -d "$(dirname "$z")" && rm -f "$z"; done
            roots=$( { find "$d" -maxdepth 5 -type d \( -name catalogs -o -name catprev -o -name docs -o -name img \) -prune -printf '%h\n'
                       find "$d" -maxdepth 5 -type f -name index.html -printf '%h\n'; } | sort -u )
            [ -z "$roots" ] && continue
            while IFS= read -r r; do cp -a "$r"/. ./; done <<< "$roots"
            rm -rf "$d"
          done
          touch .nojekyll

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to unpack - the site files are already in place."
          else
            git commit -m "Unpack site files to the top level"
            git push
          fi

      - name: Prepare the website (exam answer files are never published)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='*questions*.json' --exclude='README.md' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
