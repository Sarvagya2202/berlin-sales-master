{"name":"Deploy Berlin Sales Master","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"read","pages":"write","id-token":"write"},"concurrency":{"group":"pages","cancel-in-progress":true},"jobs":{"deploy":{"runs-on":"ubuntu-latest","environment":{"name":"github-pages","url":"${{ steps.deployment.outputs.page_url }}"},"steps":[{"uses":"actions/checkout@v4"},{"name":"Assemble site","run":"P=$(find . -name 'site.zip.part*' -not -path './.git/*' | sort -t t -k3); echo \"$P\"; N=$(echo \"$P\" | grep -c part || true); if [ \"$N\" -lt 12 ]; then echo \"Waiting for all 12 parts (found $N)\"; exit 1; fi; cat $(find . -name 'site.zip.part*' -not -path './.git/*' | awk -F'part' '{print $NF\" \"$0}' | sort -n | cut -d' ' -f2-) > site.zip && mkdir -p _site && unzip -q site.zip -d _site && touch _site/.nojekyll && ls _site"},{"uses":"actions/configure-pages@v5"},{"uses":"actions/upload-pages-artifact@v3","with":{"path":"_site"}},{"id":"deployment","uses":"actions/deploy-pages@v4"}]}}}
