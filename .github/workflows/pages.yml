name: Unpack site files

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip parts and move site files to the top level
        run: |
          shopt -s nullglob dotglob
          for z in *.zip *.ZIP; do unzip -o -q "$z" -d . && rm -f "$z"; done
          for d in */; do
            d="${d%/}"
            case "$d" in catalogs|catprev|docs|img|.github|.git) continue;; esac
            find "$d" -iname '*.zip' -type f -print0 | while IFS= read -r -d '' z; do unzip -o -q "$z" -d "$(dirname "$z")" && rm -f "$z"; done
            roots=$( { find "$d" -maxdepth 5 -type d \( -name catalogs -o -name catprev -o -name docs -o -name img \) -prune -printf '%h\n'
                       find "$d" -maxdepth 5 -type f -name index.html -printf '%h\n'; } | sort -u )
            [ -z "$roots" ] && continue
            while IFS= read -r r; do cp -a "$r"/. ./; done <<< "$roots"
            rm -rf "$d"
          done
          touch .nojekyll

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to unpack - the site files are already in place."
          else
            git commit -m "Unpack site files to the top level"
            git push
          fi
